<!doctype html>
<html lang="en">
<head>

<title>Kashtan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4efe6; --ink-dim:rgba(244,239,230,.62); --glass:rgba(18,20,26,.42);
    --glass-hi:rgba(255,248,235,.16); --line:rgba(255,255,255,.14); --accent:#e8c27a;
    --serif:'Cormorant Garamond',Georgia,serif; --sans:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #fade{position:fixed;inset:0;background:#07080b;opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:20}
  #intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;
    background:radial-gradient(ellipse at 50% 60%,rgba(8,10,14,.15),rgba(8,10,14,.78));transition:opacity 1.6s ease}
  #intro.gone{opacity:0;pointer-events:none}
  .card{text-align:center;padding:24px 16px;max-width:520px}
  .ru{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--accent);letter-spacing:.08em}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,13vw,104px);margin:.05em 0 .1em;letter-spacing:.04em;line-height:1}
  .sub{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-dim)}
  .card p{font-family:var(--serif);font-size:21px;line-height:1.45;color:var(--ink);margin:26px 0 30px;font-style:italic}
  #begin{font:500 14px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#1a1408;background:var(--accent);
    border:0;border-radius:999px;padding:14px 38px;cursor:pointer;box-shadow:0 8px 30px rgba(232,194,122,.25)}
  #begin:hover{filter:brightness(1.08)}
  .small{margin-top:16px;font-size:12px;color:var(--ink-dim);letter-spacing:.06em}
  #hudtop{position:fixed;left:16px;top:14px;z-index:10;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  #hudtop .t{font-family:var(--serif);font-size:24px;letter-spacing:.04em}
  #hudtop .s{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin-top:2px}
  #nuts{position:fixed;right:16px;top:14px;z-index:10;font-size:15px;background:var(--glass);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px 14px;display:none}
  #caption{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));text-align:center;
    font-family:var(--serif);font-style:italic;font-size:clamp(20px,3.2vw,28px);line-height:1.35;z-index:10;pointer-events:none;
    opacity:0;transition:opacity 1.4s ease;text-shadow:0 2px 14px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.6)}
  #caption.on{opacity:1}
  #ui{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px 14px;transition:opacity .8s}
  #ui.hidden{opacity:0;pointer-events:none}
  #ctx{display:flex;gap:8px;min-height:36px}
  #ctx button{background:rgba(232,194,122,.9);color:#1a1408;border-color:transparent}
  #bar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:18px;padding:8px 10px;max-width:100%}
  .grp{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  button.p{font:500 12.5px var(--sans);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 12px;cursor:pointer;letter-spacing:.02em;white-space:nowrap}
  button.p:hover{background:var(--glass-hi)}
  button.p.on{background:rgba(255,248,235,.9);color:#141210}
  #hint{font-size:12px;color:var(--ink-dim);text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.6);transition:opacity 1s}
  @media (max-width:640px){ #caption{bottom:210px} button.p{padding:6px 9px;font-size:12px} #bar{gap:4px 8px} }
</style>

<body>
<div id="intro"><div class="card">
  <div class="ru">Каштан</div>
  <h1>Kashtan</h1>
  <div class="sub">Engelsa iela 78 · Rīga · 1984</div>
  <p>A long gravel road, the garages, the old ladies' gardens —<br>and at the end of it, to the right, the tree.</p>

  <div class="small">Sound on · headphones recommended</div>
</div></div>
<div id="hudtop"><div class="t" id="seasonT">Весна</div><div class="s" id="seasonS">May · Rīga 1984</div></div>

    <div class="grp" id="g-season"></div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== utilities ============================== */
let seed = 1984;
function rng(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rnd = (a, b) => a + (b - a) * rng();
const pick = a => a[Math.floor(rng() * a.length)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const V3 = THREE.Vector3, C = (h) => new THREE.Color(h);
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const yawTo = (from, to) => Math.atan2(-(to.x - from.x), -(to.z - from.z));
function hash2(x, y){ const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v); }
function fbm(x, y){ let f = 0, a = 0.5; for (let i = 0; i < 4; i++){ f += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= 0.5; } return f; }

function tex(w, h, draw, { repeat = [1, 1], srgb = true } = {}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); t.anisotropy = 8; return t;
}
function blot(g, x, y, r, col){ g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function speckle(g, w, h, n, cols, r0 = 0.5, r1 = 1.6){ for (let i = 0; i < n; i++) blot(g, rng() * w, rng() * h, rnd(r0, r1), pick(cols)); }

/* ============================== renderer ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbcd6ea, 0.004);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 2500);
camera.rotation.order = 'YXZ';
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* shared shader hooks */
const snowU = { value: 0 }, timeU = { value: 0 }, windU = { value: 0.6 }, liftU = { value: 0.15 };
function snowify(mat, k = 1){
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uSnow = snowU; sh.uniforms.uSnowK = { value: k };
    sh.vertexShader = 'varying float vSnowN;\n' + sh.vertexShader.replace('#include <beginnormal_vertex>',
      '#include <beginnormal_vertex>\n vSnowN = normalize(mat3(modelMatrix) * objectNormal).y;');
    sh.fragmentShader = 'uniform float uSnow; uniform float uSnowK; varying float vSnowN;\n' + sh.fragmentShader.replace('#include <color_fragment>',
      '#include <color_fragment>\n diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.92,0.94,0.98), clamp(uSnow*uSnowK,0.,1.) * smoothstep(0.2,0.7,vSnowN));');
  };
  return mat;
}
function swayify(mat, amp){
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = timeU; sh.uniforms.uWind = windU; sh.uniforms.uAmp = { value: amp };
    sh.vertexShader = 'uniform float uTime; uniform float uWind; uniform float uAmp;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
      vec3 ip = instanceMatrix[3].xyz;
      float w = sin(uTime*1.3 + ip.x*0.6 + ip.z*0.4)*0.6 + sin(uTime*2.7 + ip.y*1.3)*0.3 + sin(uTime*5.3 + ip.x*3.0)*0.12;
      transformed.x += w * uAmp * uWind * position.y;
      transformed.z += w * uAmp * 0.7 * uWind * position.y;
      #endif`);
    sh.uniforms.uLift = liftU;
    sh.fragmentShader = 'uniform float uLift;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n totalEmissiveRadiance += diffuseColor.rgb * uLift;');
  };
  return mat;
}

/* ============================== textures ============================== */
const grassTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#b4b4ac'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++){ const x = rng() * w, y = rng() * h, l = 140 + rng() * 100 | 0;
    g.strokeStyle = `rgba(${l - 15},${l},${l - 25},.55)`; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-2, 2), y - rnd(3, 9)); g.stroke(); }
}, { repeat: [150, 150] });

const dirtTex = tex(256, 1024, (g, w, h) => {
  g.fillStyle = '#8d7d65'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++){ const d = rng() < 0.5; blot(g, rng() * w, rng() * h, rnd(4, 30), d ? 'rgba(60,50,38,.12)' : 'rgba(190,175,150,.10)'); }
  for (const cx of [0.28, 0.72]){ for (let y = 0; y < h; y += 2){ const x = cx * w + Math.sin(y * 0.02) * 6;
    g.fillStyle = 'rgba(55,45,35,.10)'; g.fillRect(x - 18, y, 36, 2); g.fillStyle = 'rgba(55,45,35,.10)'; g.fillRect(x - 9, y, 18, 2); } }
  speckle(g, w, h, 7000, ['#a89c88', '#6b5f4f', '#c4baa8', '#5a5048', '#978a75'], 0.6, 2.2);
}, { repeat: [1, 34] });

const barkTex = tex(256, 512, (g, w, h) => {
  g.fillStyle = '#5d5147'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++){ let x = rng() * w; const y = rng() * h, len = rnd(40, 220);
    g.strokeStyle = rng() < 0.55 ? 'rgba(28,22,18,.65)' : 'rgba(135,122,108,.35)'; g.lineWidth = rnd(1, 5);
    g.beginPath(); g.moveTo(x, y); for (let k = 0; k < len; k += 10){ x += rnd(-3, 3); g.lineTo(x, y + k); } g.stroke(); }
  speckle(g, w, h, 300, ['rgba(120,140,90,.35)', 'rgba(160,160,140,.3)'], 1, 4);
}, { repeat: [2, 1] });

const leafTex = tex(256, 256, (g, w, h) => {
  const bx = w / 2, by = h * 0.96, n = 7;
  for (let i = 0; i < n; i++){
    const o = i - (n - 1) / 2, a = o * 0.42, L = h * 0.8 * (1 - Math.abs(o) * 0.13), W = L * 0.21;
    g.save(); g.translate(bx, by); g.rotate(a);
    const gr = g.createLinearGradient(0, 0, 0, -L); gr.addColorStop(0, '#c4ccbc'); gr.addColorStop(0.6, '#f4f6f0'); gr.addColorStop(1, '#ffffff');
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, -L * 0.06);
    g.bezierCurveTo(W * 1.15, -L * 0.42, W * 1.1, -L * 0.86, 0, -L); g.bezierCurveTo(-W * 1.1, -L * 0.86, -W * 1.15, -L * 0.42, 0, -L * 0.06); g.fill();
    g.strokeStyle = 'rgba(110,120,100,.8)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, -L * 0.06); g.lineTo(0, -L * 0.96); g.stroke();
    g.lineWidth = 0.8; g.strokeStyle = 'rgba(110,120,100,.45)';
    for (let k = 0.2; k < 0.88; k += 0.07){ g.beginPath(); g.moveTo(0, -L * k); g.lineTo(W * 0.85, -L * (k + 0.08)); g.moveTo(0, -L * k); g.lineTo(-W * 0.85, -L * (k + 0.08)); g.stroke(); }
    g.restore();
  }
  g.strokeStyle = '#aab298'; g.lineWidth = 4; g.beginPath(); g.moveTo(bx, by); g.lineTo(bx, h); g.stroke();
});

const candleTex = tex(128, 256, (g, w, h) => {
  g.strokeStyle = '#8a9a60'; g.lineWidth = 3; g.beginPath(); g.moveTo(w / 2, h); g.lineTo(w / 2, h * 0.1); g.stroke();
  for (let i = 0; i < 280; i++){
    const t = Math.pow(rng(), 0.8), y = h * (0.97 - t * 0.9), mw = (1 - t) * w * 0.4 + 3, x = w / 2 + rnd(-1, 1) * mw, r = rnd(4, 8) * (1 - t * 0.45);
    blot(g, x + 1, y + 1.5, r, 'rgba(150,150,140,.8)'); blot(g, x, y, r, '#ffffff');
    if (rng() < 0.35) blot(g, x + rnd(-1, 1), y + rnd(-1, 1), r * 0.35, rng() < 0.55 ? '#f0c440' : '#e05a78');
  }
});

const dotTex = tex(64, 64, (g, w, h) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
const flameTex = tex(64, 128, (g, w, h) => { const gr = g.createRadialGradient(32, 92, 2, 32, 80, 60);
  gr.addColorStop(0, 'rgba(255,250,220,1)'); gr.addColorStop(0.25, 'rgba(255,190,80,.9)'); gr.addColorStop(0.6, 'rgba(230,90,20,.45)'); gr.addColorStop(1, 'rgba(120,20,0,0)');
  g.fillStyle = gr; g.beginPath(); g.moveTo(32, 2); g.bezierCurveTo(62, 60, 62, 126, 32, 126); g.bezierCurveTo(2, 126, 2, 60, 32, 2); g.fill(); });

function drawStucco(g, w, h, ppm){
  g.fillStyle = '#a29f96'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < w * h / 500; i++){ const l = rnd(-1, 1); blot(g, rng() * w, rng() * h, rnd(6, 40),
    l > 0 ? `rgba(255,252,240,${l * 0.07})` : `rgba(40,38,32,${-l * 0.09})`); }
  speckle(g, w, h, w * h / 60, ['rgba(60,58,50,.25)', 'rgba(240,238,230,.25)'], 0.5, 1.4);
  for (let i = 0; i < w / 28; i++){ const x = rng() * w, len = rnd(0.15, 0.85) * h, ww = rnd(6, 60);
    const gr = g.createLinearGradient(0, 0, 0, len); gr.addColorStop(0, 'rgba(72,62,48,.42)'); gr.addColorStop(1, 'rgba(72,62,48,0)'); g.fillStyle = gr; g.fillRect(x, 0, ww, len); }
  const dh = 2.2 * ppm, gb = g.createLinearGradient(0, h, 0, h - dh);
  gb.addColorStop(0, 'rgba(58,54,44,.55)'); gb.addColorStop(1, 'rgba(58,54,44,0)'); g.fillStyle = gb; g.fillRect(0, h - dh, w, dh);
  g.fillStyle = '#6c6860'; g.fillRect(0, h - 0.6 * ppm, w, 0.6 * ppm);
  for (let i = 0; i < w / 150; i++){ const x = rng() * w, y = rnd(0.1, 0.95) * h, pw = rnd(20, 110), ph = rnd(14, 60);
    g.fillStyle = '#8b5444'; g.beginPath(); g.moveTo(x, y); for (let a = 0; a < TAU; a += 0.6) g.lineTo(x + Math.cos(a) * pw * rnd(0.6, 1) / 2, y + Math.sin(a) * ph * rnd(0.6, 1) / 2); g.fill();
    g.strokeStyle = 'rgba(200,190,170,.5)'; g.lineWidth = 1; for (let yy = y - ph / 2; yy < y + ph / 2; yy += 6){ g.beginPath(); g.moveTo(x - pw / 3, yy); g.lineTo(x + pw / 3, yy); g.stroke(); } }
  g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(0, 0, w, 0.22 * ppm);
}

/* ============================== world layout ============================== */
const TREE = new V3(12, 0, -137);
const BW = 36, BH = 10.5, BD = 12, BZ = -150;     // building front face at z = -150
const HOME = new V3(5.4, 8.95, BZ);               // 3rd floor, centre-right window
const FIRE = new V3(TREE.x - 4.2, 0, TREE.z + 7.5);

/* ============================== lights & sky ============================== */
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x5a5040, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 320 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; scene.add(sun, sun.target);

const skyU = { top: { value: C('#3f7fc6') }, horizon: { value: C('#b9d3e8') }, ground: { value: C('#6a6458') },
  sunDir: { value: new V3(0, 1, 0) }, sunCol: { value: C('#fff1d8') }, moonDir: { value: new V3(0, 1, 0) }, night: { value: 0 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top, horizon, ground, sunCol, sunDir, moonDir; uniform float night; varying vec3 vD;
  void main(){ vec3 d = normalize(vD); float h = d.y;
    vec3 c = h > 0. ? mix(horizon, top, pow(clamp(h,0.,1.), 0.45)) : mix(horizon, ground, clamp(-h*5.,0.,1.));
    float s = max(dot(d, sunDir), 0.); c += sunCol * (pow(s, 1200.)*8. + pow(s, 14.)*0.35 + pow(s, 3.)*0.07);
    float m = max(dot(d, moonDir), 0.);
    c += vec3(0.95,0.97,1.0) * night * (smoothstep(0.99955, 0.9997, m)*1.4 + pow(m, 60.)*0.12);
    gl_FragColor = vec4(c, 1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }` }));
sky.renderOrder = -10; scene.add(sky);

function makeStars(n, size){
  const p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){ const u = rng() * TAU, v = Math.acos(rnd(0.02, 1)); p[i * 3] = Math.sin(v) * Math.cos(u) * 1500; p[i * 3 + 1] = Math.cos(v) * 1500; p[i * 3 + 2] = Math.sin(v) * Math.sin(u) * 1500; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({ color: 0xffffff, size, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false, map: dotTex });
  const s = new THREE.Points(g, m); s.renderOrder = -9; scene.add(s); return s;
}
const stars = [makeStars(1800, 1.6), makeStars(300, 3.0)];

/* ============================== ground & road ============================== */
{
  const gg = new THREE.PlaneGeometry(900, 900, 120, 120); gg.rotateX(-Math.PI / 2);
  const col = new Float32Array(gg.attributes.position.count * 3), pos = gg.attributes.position;
  for (let i = 0; i < pos.count; i++){ const x = pos.getX(i), z = pos.getZ(i); const n = 0.72 + 0.4 * fbm(x * 0.04 + 10, z * 0.04);
    col[i * 3] = n * 1.02; col[i * 3 + 1] = n; col[i * 3 + 2] = n * 0.92; }
  gg.setAttribute('color', new THREE.BufferAttribute(col, 3));
  var groundMat = snowify(new THREE.MeshStandardMaterial({ map: grassTex, vertexColors: true, roughness: 1, color: '#7aa048' }));
  const ground = new THREE.Mesh(gg, groundMat); ground.receiveShadow = true; scene.add(ground);
}

  [0.0, C('#45588e'), C('#f08a5a')], [0.08, C('#5b84bb'), C('#f2c08a')], [0.22, C('#4a86c6'), C('#c4d8e6')], [1.0, C('#3a78c0'), C('#b4cfe6')] ];
function skyAt(e, top, hor){ if (e <= skyKeys[0][0]){ top.copy(skyKeys[0][1]); hor.copy(skyKeys[0][2]); return; }
  for (let i = 0; i < skyKeys.length - 1; i++){ const a = skyKeys[i], b = skyKeys[i + 1]; if (e <= b[0]){ const t = (e - a[0]) / (b[0] - a[0]); top.copy(a[1]).lerp(b[1], t); hor.copy(a[2]).lerp(b[2], t); return; } }
  top.copy(skyKeys[skyKeys.length - 1][1]); hor.copy(skyKeys[skyKeys.length - 1][2]); }
const env = { day: 1, night: 0, e: 0.5 };
const sunDir = new V3(), moonDir = new V3(), overcastTop = C('#9aa4ae'), overcastHor = C('#cfd3d6');
function updateEnv(sp){
  const elevMax = lerp(0.22, 0.92, 0.5 - 0.5 * Math.cos(TAU * (S - 0.5) / 4));
  const a = (TOD - 0.25) * TAU;
  sunDir.set(Math.cos(a), Math.sin(a) * elevMax, Math.sin(a) * 0.75 + 0.15).normalize();
  moonDir.set(-sunDir.x * 0.8 + 0.2, Math.max(0.25, -sunDir.y), -sunDir.z * 0.5 + 0.4).normalize();
  const e = sunDir.y; env.e = e;
  env.day = smooth((e + 0.06) / 0.26); env.night = 1 - smooth((e + 0.2) / 0.18);
  const over = sp.snow * 0.55 + (S > 3.4 && S < 3.95 ? 0.2 : 0);
  skyAt(e, skyU.top.value, skyU.horizon.value);
  skyU.top.value.lerp(tmpC.copy(overcastTop).multiplyScalar(0.25 + 0.75 * env.day), over * env.day);
  skyU.horizon.value.lerp(tmpC.copy(overcastHor).multiplyScalar(0.25 + 0.75 * env.day), over * env.day);
  skyU.ground.value.copy(skyU.horizon.value).multiplyScalar(0.7);
  skyU.sunDir.value.copy(sunDir); skyU.moonDir.value.copy(moonDir); skyU.night.value = env.night;
  skyU.sunCol.value.set(e > 0.15 ? '#fff4e0' : '#ffb070').multiplyScalar(smooth((e + 0.05) / 0.1) * (1 - over * 0.7));
  scene.fog.color.copy(skyU.horizon.value);
  scene.fog.density = 0.0032 + sp.snow * 0.0025 + sp.snowfall * 0.002 + env.night * 0.0015;
  const sunI = 3.2 * smooth(e / 0.12) * (1 - over * 0.55);
  const tgt = camera.position.clone().add(new V3(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw)).multiplyScalar(18)); tgt.y = 0;
  if (tgt.distanceTo(TREE) < 45) tgt.lerp(TREE, 0.5);
  sun.target.position.copy(tgt);
  if (e > -0.03){ sun.position.copy(tgt).addScaledVector(sunDir, 120); sun.color.set(e > 0.18 ? '#fff2df' : '#ffb27a'); sun.intensity = sunI; }
  else { sun.position.copy(tgt).addScaledVector(moonDir, 120); sun.color.set('#9fb4ff'); sun.intensity = 0.45 * env.night; }
  hemi.color.copy(skyU.top.value).lerp(C('#ffffff'), 0.35); hemi.groundColor.set(sp.snow > 0.5 ? '#9aa0a8' : '#5a5040');
  hemi.intensity = 0.25 + 0.95 * env.day;
  renderer.toneMappingExposure = 1.0 + env.night * 0.55;
  for (const s of stars) s.material.opacity = env.night * (1 - over * 0.6);
  const lit = 1 - env.day;
  buildingFront.emissiveIntensity = lit * 1.6; for (const m of blockMats) m.emissiveIntensity = lit * 1.2;
  lamp.intensity = lit * 14; lampGlow.material.opacity = lit * 0.9;
  roomLight.intensity = mode === 'window' ? 1.5 + lit * 4 : 0;
  groundMat.color.copy(cyc(S, groundKeys, tmpC));
  snowU.value = sp.snow;
  liftU.value = 0.03 + 0.2 * env.day;
}

/* ---------- tree & garden updates (only when the season moves) ---------- */
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), SC = new V3(), P3 = new V3();
const youngC = C('#b6e274'), summerC = C('#4c8c36'), yellowA = C('#e2b42e'), yellowB = C('#d48a22'), brownC = C('#7a4f28');
let lastS = -1, lastLeaf = 0;
function updateSeasonal(sp){
  if (Math.abs(S - lastS) < 0.0015) return;
  const prevS = lastS; lastS = S;
  const young = 1 - smooth((S - 1.45) / 0.65), turnA = clamp((S - 2.88) / 0.55);
  for (let i = 0; i < LEAVES.length; i++){ const L = LEAVES[i];
    const vis = clamp((sp.leaf * 1.18 - L.r) / 0.18);
    SC.setScalar(L.s * vis * (0.55 + 0.45 * smooth((S - 1.05) / 0.5))); M4.compose(L.p, L.q, SC); leaves.setMatrixAt(i, M4);
    tmpC.copy(summerC).lerp(youngC, young);
    const turn = clamp(turnA * 1.6 - L.r2 * 0.6);
    if (turn > 0){ tmpC2.copy(yellowA).lerp(yellowB, L.hue); tmpC.lerp(tmpC2, smooth(turn * 2)); if (turn > 0.5) tmpC.lerp(brownC, smooth((turn - 0.5) * 2) * 0.8); }
    tmpC.multiplyScalar(L.v); leaves.setColorAt(i, tmpC); }
  leaves.instanceMatrix.needsUpdate = true; leaves.instanceColor.needsUpdate = true;
  for (let i = 0; i < CANDLES.length; i++){ const c = CANDLES[i]; const vis = clamp((sp.blossom * 1.25 - c.r) / 0.25);
    SC.setScalar(c.s * vis); M4.compose(c.p, c.q, SC); candles.setMatrixAt(i, M4); }
  candles.instanceMatrix.needsUpdate = true; candles.visible = sp.blossom > 0.001;
  huskMat.color.set('#7aa040').lerp(tmpC.set('#8a7a3a'), smooth((S - 2.9) / 0.35));
  for (let i = 0; i < HUSKS.length; i++){ const h = HUSKS[i]; const on = S < h.drop ? sp.husk : 0;
    if (prevS > 0 && prevS < h.drop && S >= h.drop && S - prevS < 0.3) spawnNut(h.p.clone().add(TREE));
    SC.setScalar(h.s * on); Q.identity(); M4.compose(h.p, Q, SC); husks.setMatrixAt(i, M4); }
  husks.instanceMatrix.needsUpdate = true; husks.visible = sp.husk > 0.001;
  for (let i = 0; i < LITTER.length; i++){ const L = LITTER[i]; const vis = clamp((sp.litter * 1.1 - L.r) / 0.1);
    Q.setFromAxisAngle(P3.set(0, 1, 0), L.rot); SC.setScalar(L.s * vis); M4.compose(L.p, Q, SC); litter.setMatrixAt(i, M4); litter.setColorAt(i, L.c); }
  litter.instanceMatrix.needsUpdate = true; litter.instanceColor.needsUpdate = true; litter.visible = sp.litter > 0.001;
  // gardens
  updateOrchard();
  vegData.forEach((v, i) => { SC.setScalar(v.s * sp.veg * (v.kind < 0.5 ? 1 : 0.7)); Q.identity(); M4.compose(v.p, Q, SC); veg.setMatrixAt(i, M4); }); veg.instanceMatrix.needsUpdate = true; veg.visible = sp.veg > 0.001;
  flowerData.forEach((f, i) => { const k = sp.flowers; SC.setScalar(f.s * k); Q.identity(); P3.copy(f.p); P3.y = f.p.y * k; M4.compose(P3, Q, SC); flowers.setMatrixAt(i, M4);
    SC.set(1, f.p.y * k, 1); P3.set(f.p.x, 0, f.p.z); M4.compose(P3, Q, SC); stems.setMatrixAt(i, M4); });
  flowers.instanceMatrix.needsUpdate = stems.instanceMatrix.needsUpdate = true; flowers.visible = stems.visible = sp.flowers > 0.001;
  sunData.forEach((s, i) => { const k = sp.sunfl, h = s.h * k; Q.setFromEuler(new THREE.Euler(-0.3, 0, 0)); SC.setScalar(k); P3.set(s.p.x, h, s.p.z + 0.08); M4.compose(P3, Q, SC); sunHeads.setMatrixAt(i, M4);
    Q.identity(); SC.set(1, Math.max(h, 0.001), 1); P3.set(s.p.x, 0, s.p.z); M4.compose(P3, Q, SC); sunStems.setMatrixAt(i, M4); });
  sunHeads.instanceMatrix.needsUpdate = sunStems.instanceMatrix.needsUpdate = true; sunHeads.visible = sunStems.visible = sp.sunfl > 0.001;
  { let j = 0; for (const L of lilacData) for (let k = 0; k < 10; k++){ SC.setScalar(sp.lilac); Q.identity(); M4.compose(L['b' + k], Q, SC); lilacBloom.setMatrixAt(j++, M4); } }
  lilacBloom.instanceMatrix.needsUpdate = true; lilacBloom.visible = sp.lilac > 0.001;
  if (sp.snow > 0.5) NUTs.forEach(n => n.on = false);
}

/* ============================== camera & controls ============================== */
const cam = { yaw: 0, pitch: 0 };
let mode = 'intro', perch = 0, tween = null, nutsHeld = 0, roasted = 0, started = false;
const keys = new Set(), pointers = new Map();
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { pointers.set(e.pointerId, e); drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e => { if (!drag || !pointers.has(e.pointerId)) return; pointers.set(e.pointerId, e);
  if (pointers.size > 1) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (tween || mode === 'intro') return; cam.yaw -= dx * 0.0042; cam.pitch = clamp(cam.pitch - dy * 0.0042, -1.45, 1.45); });
const endPtr = e => { pointers.delete(e.pointerId); if (!pointers.size) drag = null; };
renderer.domElement.addEventListener('pointerup', endPtr); renderer.domElement.addEventListener('pointercancel', endPtr);
addEventListener('keydown', e => {
  if (!started) return; keys.add(e.code);
  const k = e.code;
  if (k >= 'Digit1' && k <= 'Digit4') setSeason(+k.slice(5) - 1);
  if (k === 'KeyT') setTime(Object.keys(TIMES)[(Object.values(TIMES).findIndex(v => Math.abs(v - (todTarget ?? TOD)) < 0.02) + 1) % 4]);
  if (k === 'KeyV') setMode('window');
  if (k === 'KeyL') setMode('lie');
  if (k === 'KeyC') setMode('climb');
  if (k === 'Escape' || k === 'KeyG') setMode('walk');
  if (k === 'KeyE'){ if (mode === 'climb') climb(1); else if (mode === 'walk' && distTree() < 5) setMode('climb'); }
  if (k === 'KeyQ' && mode === 'climb') climb(-1);
  if (mode === 'climb' && (k === 'KeyW' || k === 'ArrowUp')) climb(1);
  if (mode === 'climb' && (k === 'KeyS' || k === 'ArrowDown')) climb(-1);
  if (k === 'KeyF' || k === 'KeyK') shake();
  if (k === 'KeyR') roast();
  if (k === 'KeyM') toggleMusic();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const distTree = () => Math.hypot(camera.position.x - TREE.x, camera.position.z - TREE.z);
function goTo(p, yaw, pitch, dur = 2.2){ tween = { p0: camera.position.clone(), y0: cam.yaw, pi0: cam.pitch, p1: p.clone(), y1: yaw, pi1: pitch, t: 0, dur }; }
function place(p, yaw, pitch){ camera.position.copy(p); cam.yaw = yaw; cam.pitch = pitch; tween = null; }
const fadeEl = document.getElementById('fade');
function fadeThen(fn){ fadeEl.style.opacity = 1; setTimeout(() => { fn(); lastS = -1; fadeEl.style.opacity = 0; }, 750); }
const WIN_POS = new V3(HOME.x - 0.15, 8.9, BZ - 0.95), WIN_LOOK = TREE.clone().add(new V3(0, 9, 0));
function setMode(m){
  if (!started || m === mode && m !== 'climb') return;
  const prev = mode;
  if (m === 'walk'){
    mode = 'walk';
    if (prev === 'climb' || prev === 'lie'){ const p = TREE.clone().add(new V3(-2.5, 1.6, 5)); goTo(p, yawTo(p, TREE) + Math.PI, 0, 1.8); }
    else if (prev === 'window') fadeThen(() => { const p = new V3(10.5, 1.6, BZ + 3.5); place(p, yawTo(p, TREE.clone().add(new V3(0, 0, 3))), 0.15); });
  } else if (m === 'window'){
    fadeThen(() => { mode = 'window'; place(WIN_POS, Math.PI + wrapA(yawTo(WIN_POS, WIN_LOOK) - Math.PI) * 0.45, 0.12);
      caption(pick(['From my window on the third floor, the tree was the whole world.', 'I would sit here for hours, and the tree would sit there with me.', 'Some evenings I wrote poems to it in a school notebook.'])); });
  } else if (m === 'climb'){
    const go = () => { mode = 'climb'; perch = 0; const P = PERCH[0]; goTo(P.p, P.yaw, P.pitch, 2.2); caption(P.text); };
    if (prev === 'window' || distTree() > 9) fadeThen(() => { place(TREE.clone().add(new V3(-1.5, 1.6, 3.5)), Math.PI * 0.95, 0.3); go(); }); else go();
  } else if (m === 'lie'){
    const p = TREE.clone().add(new V3(2.4, 0.32, 3.4)), go = () => { mode = 'lie'; goTo(p, yawTo(p, TREE), 1.05, 2.4);
      caption(env.night > 0.5 ? 'We lay in the grass and counted the stars between the leaves.' : 'Lying on my back in the grass, looking up into the branches.'); };
    if (prev === 'window' || distTree() > 15) fadeThen(() => { place(p.clone().add(new V3(0, 1.3, 2)), yawTo(p, TREE), 0.2); go(); }); else go();
  }
  syncButtons();
}
function climb(dir){
  if (tween) return;
  const n = perch + dir;
  if (n < 0){ setMode('walk'); return; }
  if (n >= PERCH.length){ caption('No higher. Only sky up there.', 3); return; }
  perch = n; const P = PERCH[n]; goTo(P.p, P.yaw, P.pitch, 2.0); caption(P.text);
}

/* ============================== interactions ============================== */
let shakeT = 0;
function shake(){
  if (!(mode === 'walk' && distTree() < 6) && mode !== 'climb') return;
  if (shakeT > 0.4) return;
  shakeT = 1.6; const sp = SP(S); sfx.thump(); catScare();
  if (sp.snow > 0.3){ for (let i = 0; i < 900; i++){ const t = pick(tree.tips); snowPuff.spawn(TREE.x + t.p.x + rnd(-0.6, 0.6), TREE.y + t.p.y, TREE.z + t.p.z + rnd(-0.6, 0.6), rnd(-0.3, 0.3), rnd(-1, 0), rnd(-0.3, 0.3), rnd(3, 6)); }
    caption('Snow came down from every branch at once — straight down our collars.', 4); }
  if (sp.blossom > 0.25 || sp.petals > 0.2){ for (let i = 0; i < 400; i++){ const t = pick(tree.tips); petals.spawn(TREE.x + t.p.x + rnd(-0.8, 0.8), t.p.y + rnd(0, 0.8), TREE.z + t.p.z + rnd(-0.8, 0.8)); } caption('A white blizzard of petals, in May.', 4); }
  if (sp.birds > 0.4){ BIRDS.forEach(b => { b.state = 'fly'; birdTarget(b, true); b.timer = rnd(6, 12); }); sfx.flutter(); }
  if (sp.husk > 0.2 || sp.nutfall > 0.1){ const n = 8 + Math.floor(rng() * 8); for (let i = 0; i < n; i++){ const t = pick(tree.tips); spawnNut(t.p.clone().add(TREE)); }
    for (let i = 0; i < 40; i++){ const L = pick(LEAVES); spawnLeaf(L.p.clone().add(TREE), C(pick(['#d8a83a', '#c47a2a', '#8a5a2a']))); }
    caption('Kick the trunk and they rain down — mind your head!', 4); }
  else if (sp.leaf > 0.5 && sp.birds <= 0.4) caption('The old tree barely noticed.', 3);
}
function roast(){
  if (!(nutsHeld > 0 && distTree() < 16 && (mode === 'walk' || mode === 'lie')) || fire.on) return;
  fire.on = true; fire.t = 0; fire.roastT = 2.5;
  caption(pick(['We made a small fire and roasted chestnuts in the coals. They popped like little cannons.', 'Smoke in our hair, black fingers, the best thing we ever ate.']), 6);
  syncCtx();
}
