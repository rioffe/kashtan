<style>
  :root{
    --ink:#f4efe6; --ink-dim:rgba(244,239,230,.62); --glass:rgba(18,20,26,.42);

    --serif:'Cormorant Garamond',Georgia,serif; --sans:Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #fade{position:fixed;inset:0;background:#07080b;opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:20}
  #intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;
    background:radial-gradient(ellipse at 50% 60%,rgba(8,10,14,.15),rgba(8,10,14,.78));transition:opacity 1.6s ease}
  #intro.gone{opacity:0;pointer-events:none}
  .card{text-align:center;padding:24px 16px;max-width:520px}
  .ru{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--accent);letter-spacing:.08em}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,13vw,104px);margin:.05em 0 .1em;letter-spacing:.04em;line-height:1}
  .sub{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-dim)}
  .card p{font-family:var(--serif);font-size:21px;line-height:1.45;color:var(--ink);margin:26px 0 30px;font-style:italic}
  #begin{font:500 14px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#1a1408;background:var(--accent);
    border:0;border-radius:999px;padding:14px 38px;cursor:pointer;box-shadow:0 8px 30px rgba(232,194,122,.25)}
  #begin:hover{filter:brightness(1.08)}
  #langs{margin-top:22px;display:flex;gap:6px;justify-content:center}
  #langs button{font:500 12.5px var(--sans);color:var(--ink-dim);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;letter-spacing:.04em}
  #langs button.on{color:#141210;background:rgba(255,248,235,.9);border-color:transparent}
  .ded{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--accent);opacity:.85;margin:-14px 0 26px;letter-spacing:.02em;line-height:1.35;text-shadow:0 1px 10px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.7)}
  .small{margin-top:16px;font-size:12px;color:var(--ink-dim);letter-spacing:.06em}
  #hudtop{position:fixed;left:16px;top:14px;z-index:10;pointer-events:auto;user-select:none;-webkit-user-select:none;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  #hudtop .t{font-family:var(--serif);font-size:24px;letter-spacing:.04em}
  #hudtop .s{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin-top:2px}
  #nuts{position:fixed;right:16px;top:14px;z-index:10;font-size:15px;background:var(--glass);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px 14px;display:none}
  #caption{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));text-align:center;
    font-family:var(--serif);font-style:italic;font-size:clamp(20px,3.2vw,28px);line-height:1.35;z-index:10;pointer-events:none;
    opacity:0;transition:opacity 1.4s ease;text-shadow:0 2px 14px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.6)}
  #caption.on{opacity:1}
  #ui{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px calc(14px + env(safe-area-inset-bottom));transition:opacity .8s}
  html,body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

  #stick,#jumpBtn{position:fixed;z-index:11;display:none;touch-action:none;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:50%}

  #jumpBtn{right:calc(32px + env(safe-area-inset-right));bottom:calc(var(--ctl-b,170px) + 24px + env(safe-area-inset-bottom));width:84px;height:84px;color:var(--ink);font:500 30px var(--sans);cursor:pointer}

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== utilities ============================== */
let seed = 1984;
function rng(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rnd = (a, b) => a + (b - a) * rng();
const pick = a => a[Math.floor(rng() * a.length)];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const V3 = THREE.Vector3, C = (h) => new THREE.Color(h);
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const yawTo = (from, to) => Math.atan2(-(to.x - from.x), -(to.z - from.z));
function hash2(x, y){ const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y){ const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v); }
function fbm(x, y){ let f = 0, a = 0.5; for (let i = 0; i < 4; i++){ f += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= 0.5; } return f; }

function tex(w, h, draw, { repeat = [1, 1], srgb = true } = {}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); t.anisotropy = 8; return t;
}
const mkRng = seed => { let t0 = seed | 0; return () => { t0 = t0 + 0x6D2B79F5 | 0; let t = Math.imul(t0 ^ t0 >>> 15, 1 | t0); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
function blot(g, x, y, r, col){ g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function speckle(g, w, h, n, cols, r0 = 0.5, r1 = 1.6){ for (let i = 0; i < n; i++) blot(g, rng() * w, rng() * h, rnd(r0, r1), pick(cols)); }

/* ============================== renderer ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const TOUCH = new URLSearchParams(location.search).has('touch') || navigator.maxTouchPoints > 1 || matchMedia('(any-pointer: coarse)').matches;
if (TOUCH) document.body.classList.add('touch');
renderer.setPixelRatio(Math.min(devicePixelRatio, TOUCH ? 1.5 : 2));   // iPads: a little lighter on the GPU
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbcd6ea, 0.004);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 2500);
camera.rotation.order = 'YXZ';
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* shared shader hooks */
const SNOWSEGS = [], BENCHES = [], BEDS = [];   // [ax,ay,az, bx,by,bz, radius, space]: branches, twigs and stems that catch snow along their tops
const snowU = { value: 0 }, timeU = { value: 0 }, windU = { value: 0.6 }, liftU = { value: 0.15 };
function snowify(mat, k = 1){
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uSnow = snowU; sh.uniforms.uSnowK = { value: k };
    sh.vertexShader = 'varying float vSnowN;\n' + sh.vertexShader.replace('#include <beginnormal_vertex>',
      '#include <beginnormal_vertex>\n vSnowN = normalize(mat3(modelMatrix) * objectNormal).y;');
    sh.fragmentShader = 'uniform float uSnow; uniform float uSnowK; varying float vSnowN;\n' + sh.fragmentShader.replace('#include <color_fragment>',
      '#include <color_fragment>\n diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.92,0.94,0.98), clamp(uSnow*uSnowK,0.,1.) * smoothstep(0.2,0.7,vSnowN));');
  };
  return mat;
}
function swayify(mat, amp){
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = timeU; sh.uniforms.uWind = windU; sh.uniforms.uAmp = { value: amp };
    sh.vertexShader = 'uniform float uTime; uniform float uWind; uniform float uAmp;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
      vec3 ip = instanceMatrix[3].xyz;
      float w = sin(uTime*1.3 + ip.x*0.6 + ip.z*0.4)*0.6 + sin(uTime*2.7 + ip.y*1.3)*0.3 + sin(uTime*5.3 + ip.x*3.0)*0.12;
      transformed.x += w * uAmp * uWind * position.y;
      transformed.z += w * uAmp * 0.7 * uWind * position.y;
      #endif`);
    sh.uniforms.uLift = liftU;
    sh.fragmentShader = 'uniform float uLift;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n totalEmissiveRadiance += diffuseColor.rgb * uLift;');
  };
  return mat;
}

/* ============================== textures ============================== */
const grassTex = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#b4b4ac'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++){ const x = rng() * w, y = rng() * h, l = 140 + rng() * 100 | 0;
    g.strokeStyle = `rgba(${l - 15},${l},${l - 25},.55)`; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-2, 2), y - rnd(3, 9)); g.stroke(); }
}, { repeat: [150, 150] });

const dirtTex = tex(256, 1024, (g, w, h) => {
  g.fillStyle = '#8d7d65'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++){ const d = rng() < 0.5; blot(g, rng() * w, rng() * h, rnd(4, 30), d ? 'rgba(60,50,38,.12)' : 'rgba(190,175,150,.10)'); }
  for (const cx of [0.28, 0.72]){ for (let y = 0; y < h; y += 2){ const x = cx * w + Math.sin(y * 0.02) * 6;
    g.fillStyle = 'rgba(55,45,35,.10)'; g.fillRect(x - 18, y, 36, 2); g.fillStyle = 'rgba(55,45,35,.10)'; g.fillRect(x - 9, y, 18, 2); } }
  speckle(g, w, h, 7000, ['#a89c88', '#6b5f4f', '#c4baa8', '#5a5048', '#978a75'], 0.6, 2.2);
}, { repeat: [1, 34] });

const barkTex = tex(256, 512, (g, w, h) => {
  g.fillStyle = '#5d5147'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++){ let x = rng() * w; const y = rng() * h, len = rnd(40, 220);
    g.strokeStyle = rng() < 0.55 ? 'rgba(28,22,18,.65)' : 'rgba(135,122,108,.35)'; g.lineWidth = rnd(1, 5);
    g.beginPath(); g.moveTo(x, y); for (let k = 0; k < len; k += 10){ x += rnd(-3, 3); g.lineTo(x, y + k); } g.stroke(); }
  speckle(g, w, h, 300, ['rgba(120,140,90,.35)', 'rgba(160,160,140,.3)'], 1, 4);
}, { repeat: [2, 1] });

/* the chestnut's own bark: long irregular plates split by deep fissures, grey-brown with rusty undersides and pale lichen;
   the same height field gives a normal map so the cracks catch the light; a moss mask tells the shader where moss grows */
const CB = (() => {
  let s_ = 8128; const r = () => { s_ = s_ + 0x6D2B79F5 | 0; let t = Math.imul(s_ ^ s_ >>> 15, 1 | s_); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const hash = (a, b, fx, fy, sd) => { a = ((a % fx) + fx) % fx; b = ((b % fy) + fy) % fy; let n = Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(sd, 1442695041) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
  const vn = (x, y, fx, fy, sd) => { const xi = Math.floor(x), yi = Math.floor(y), tx = x - xi, ty = y - yi, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const a = hash(xi, yi, fx, fy, sd), b = hash(xi + 1, yi, fx, fy, sd), c = hash(xi, yi + 1, fx, fy, sd), d = hash(xi + 1, yi + 1, fx, fy, sd);
    return (a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy; };
  const fbm = (u, v, f, sd, oct = 4) => { let s = 0, a = 0.5, n = 0; for (let o = 0; o < oct; o++){ s += a * vn(u * f, v * f, f, f, sd + o); n += a; a *= 0.5; f *= 2; } return s / n; };
  const W = 512, H = 1024, GX = 6, GY = 7, cw = W / GX, chh = H / GY;
  const px = [], py = [], cv = [], ch = [];
  for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++){ px.push((i + 0.1 + 0.8 * r()) * cw); py.push((j + 0.1 + 0.8 * r()) * chh); cv.push(r()); ch.push(r()); }
  const hgt = new Float32Array(W * H), col = new Uint8ClampedArray(W * H * 4);
  const pal = [[108, 66, 48], [120, 74, 52], [96, 60, 44], [128, 84, 62]];   // deep reddish brown
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const u = x / W, v = y / H;
    const wx = x + 26 * (fbm(u, v, 6, 11, 3) - 0.5), wy = y + 40 * (fbm(u, v, 5, 12, 3) - 0.5);
    const ci = Math.floor(wx / cw), cj = Math.floor(wy / chh); let f1 = 1e9, f2 = 1e9, id = 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++){ const ii = ci + di, jj = cj + dj, iw = ((ii % GX) + GX) % GX, jw = ((jj % GY) + GY) % GY, k = jw * GX + iw;
      const qx = px[k] + (ii - iw) * cw, qy = py[k] + (jj - jw) * chh, dx = wx - qx, dy = (wy - qy) * 0.42, d = Math.sqrt(dx * dx + dy * dy);
      if (d < f1){ f2 = f1; f1 = d; id = k; } else if (d < f2) f2 = d; }
    const deep = smooth((vn(u * 24, v * 9, 24, 9, 13) - 0.28) / 0.3), e = f2 - f1, rim = smooth((e - 4) / 5) * (1 - smooth((e - 10) / 8));
    let crack = (1 - smooth((e - 1.2) / (3 + 5 * cv[id]))) * (0.25 + 0.75 * deep);
    const grain = vn(u * 70, v * 5, 70, 5, 21), fine = vn(u * 140, v * 60, 140, 60, 23);
    const plate = 0.55 + 0.3 * cv[id] + 0.12 * grain + 0.06 * fine - 0.22 * Math.min(1, f1 / (cw * 0.9));
    const rn = Math.abs(vn(u * 12 + 1.5 * fbm(u, v, 3, 14, 2), v * 2, 12, 2, 15) - 0.5) * 2, vline = (1 - smooth(rn / (0.05 + 0.05 * fine))) * smooth((vn(u * 8, v * 6, 8, 6, 16) - 0.3) / 0.3);
    crack = Math.max(crack, vline * 0.85);
    const hv = plate * (1 - crack) + 0.04 * crack; hgt[y * W + x] = hv;
    const c0 = pal[Math.floor(ch[id] * pal.length)], c1 = pal[(Math.floor(ch[id] * pal.length) + 1) % pal.length], mx = fbm(u, v, 4, 31, 3);
    let R = c0[0] + (c1[0] - c0[0]) * mx, G = c0[1] + (c1[1] - c0[1]) * mx, B = c0[2] + (c1[2] - c0[2]) * mx;
    const br = 0.82 + 0.3 * plate + 0.16 * (grain - 0.5) + 0.12 * (fine - 0.5); R *= br; G *= br; B *= br;
    R += 24 * rim; G += 15 * rim; B += 10 * rim;                                    // lifting, paler plate edges
    const dc = crack * crack; R = R + (40 - R) * dc; G = G + (20 - G) * dc; B = B + (14 - B) * dc;   // the fissures: dark, a little rusty
    const lich = smooth((fbm(u, v, 5, 41, 4) - 0.6) / 0.07) * (1 - crack) * (0.55 + 0.45 * fine);
    R += (150 - R) * lich * 0.5; G += (150 - G) * lich * 0.5; B += (126 - B) * lich * 0.5;
    const o = (y * W + x) * 4; col[o] = R; col[o + 1] = G; col[o + 2] = B; col[o + 3] = 255; }
  const nrm = new Uint8ClampedArray(W * H * 4), S = 5.5;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){

function mossify(mat){
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh, rr) => { if (prev) prev(sh, rr);
    sh.uniforms.uMoss = { value: CB.moss };
    sh.vertexShader = 'attribute float aThick; varying float vThick; varying vec3 vMW; varying vec3 vMN;\n' + sh.vertexShader
      .replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\n vMN = normalize(mat3(modelMatrix) * objectNormal);')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n vThick = aThick; vMW = (modelMatrix * vec4(transformed, 1.)).xyz;');
    sh.fragmentShader = 'uniform sampler2D uMoss; varying float vThick; varying vec3 vMW; varying vec3 vMN;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      diffuseColor.rgb = mix(vec3(0.21, 0.14, 0.11) * (0.85 + 0.3 * texture2D(uMoss, vMapUv * vec2(1.0, 4.0)).b), diffuseColor.rgb, smoothstep(0.035, 0.2, vThick));   // young wood: smooth grey-brown
      { float big = texture2D(uMoss, vMapUv * vec2(0.5, 0.3)).r, clump = texture2D(uMoss, vMapUv * vec2(2.0, 1.2)).g, grain = texture2D(uMoss, vMapUv * vec2(3.0, 1.6)).b;
        float up = smoothstep(0.1, 0.8, vMN.y), low = 1.0 - smoothstep(0.8, 5.8, vMW.y), side = 0.5 + 0.5 * clamp(-vMN.z * 0.7 + vMN.x * 0.4, -1.0, 1.0);
        float m = (up * 0.75 + low * (0.55 + 0.35 * side)) * smoothstep(0.05, 0.2, vThick);
        m = smoothstep(0.45, 0.68, m * 0.8 + big * 0.85 - 0.38 + (clump - 0.5) * 0.5);
        vec3 mc = mix(vec3(0.06, 0.14, 0.035), vec3(0.17, 0.3, 0.07), grain) * (0.8 + 0.4 * clump);   // deep, damp green
        float lum = dot(diffuseColor.rgb, vec3(0.3, 0.59, 0.11)); mc *= 0.35 + 0.75 * smoothstep(0.015, 0.12, lum);
        diffuseColor.rgb = mix(diffuseColor.rgb, mc, m * (0.6 + 0.35 * clump)); }`);

}
